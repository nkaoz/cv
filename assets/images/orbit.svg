<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
<style>
  @keyframes orbit-rotation { to { transform: rotate(360deg); } }
  .orbital-system { transform-box: view-box; transform-origin: center; animation: orbit-rotation 32s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .orbital-system { animation: none; } }
</style>
<defs><radialGradient id="planet" cx="0" cy="0" r="1" gradientTransform="translate(340 490) rotate(70) scale(370 370)" gradientUnits="userSpaceOnUse"><stop stop-color="#123e73"/><stop offset=".45" stop-color="#0b244a"/><stop offset=".78" stop-color="#07152d"/><stop offset="1" stop-color="#040b18"/></radialGradient><linearGradient id="rim" x1="190" y1="310" x2="680" y2="740" gradientUnits="userSpaceOnUse"><stop stop-color="#1cb7f2" stop-opacity=".75"/><stop offset=".6" stop-color="#235eb0" stop-opacity=".35"/><stop offset="1" stop-color="#0b2353" stop-opacity="0"/></linearGradient><linearGradient id="orbit" x1="60" y1="180" x2="750" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#23d9ef" stop-opacity="0"/><stop offset=".3" stop-color="#23d9ef" stop-opacity=".9"/><stop offset=".8" stop-color="#6d89ff" stop-opacity=".6"/><stop offset="1" stop-color="#23d9ef" stop-opacity="0"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="15"/></filter></defs>
<circle cx="460" cy="585" r="284" fill="#1878cb" opacity=".16" filter="url(#glow)"/><circle cx="460" cy="585" r="280" fill="url(#planet)" stroke="url(#rim)" stroke-width="2"/>
<g class="orbital-system">
  <ellipse cx="403" cy="413" rx="350" ry="140" transform="rotate(-26 403 413)" stroke="url(#orbit)" stroke-width="1.3"/><ellipse cx="413" cy="402" rx="370" ry="130" transform="rotate(31 413 402)" stroke="#3e7cce" stroke-opacity=".45"/>
  <circle cx="105" cy="450" r="5" fill="#24e5f3"><animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="245" r="5" fill="#55f4ff"><animate attributeName="r" values="4;9;4" dur="3.1s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" begin=".7s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="575" r="5" fill="#24e5f3"><animate attributeName="r" values="4;9;4" dur="2.8s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" begin="1.3s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="245" r="15" fill="#24e5f3" opacity=".2" filter="url(#glow)"><animate attributeName="r" values="10;24;10" dur="3.1s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".05;.75;.05" dur="3.1s" begin=".7s" repeatCount="indefinite"/></circle>
</g>
<g stroke="#3677bf" stroke-opacity=".35"><path d="m130 260 76-30 18 82-76 30z"/><path d="m645 335 84 19-10 75-84-19z"/><path d="m270 110 62-24 24 72-62 24z"/></g>
<g fill="#7dcfff"><circle cx="92" cy="125" r="1.4"><animate attributeName="opacity" values=".15;1;.15" dur="2.4s" repeatCount="indefinite"/><animate attributeName="r" values="1;2.5;1" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="600" cy="100" r="1.2"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin=".5s" repeatCount="indefinite"/><animate attributeName="r" values=".8;2.2;.8" dur="3.2s" begin=".5s" repeatCount="indefinite"/></circle><circle cx="742" cy="180" r="1.5"><animate attributeName="opacity" values=".15;1;.15" dur="2.8s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="r" values="1;2.7;1" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle><circle cx="320" cy="60" r="1"><animate attributeName="opacity" values=".15;1;.15" dur="3.4s" begin=".8s" repeatCount="indefinite"/><animate attributeName="r" values=".7;2;.7" dur="3.4s" begin=".8s" repeatCount="indefinite"/></circle><circle cx="54" cy="350" r="1"><animate attributeName="opacity" values=".15;1;.15" dur="2.6s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="r" values=".7;2;.7" dur="2.6s" begin="1.5s" repeatCount="indefinite"/></circle><circle cx="710" cy="600" r="1.2"><animate attributeName="opacity" values=".15;1;.15" dur="3.6s" begin="2s" repeatCount="indefinite"/><animate attributeName="r" values=".8;2.4;.8" dur="3.6s" begin="2s" repeatCount="indefinite"/></circle></g>
